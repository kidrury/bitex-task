services:
  test-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: bitex_test
      POSTGRES_USER: bitex_test
      POSTGRES_PASSWORD: bitex_test
    ports:
      - "5442:5432"
    volumes:
      - bitex_test_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bitex_test -d bitex_test"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  bitex_test_data: